# Icefin Player Flatpak manifest (PLAN 1.5, SPEC "Flatpak packaging").
# Derived from Flathub's org.jellyfin.JellyfinDesktop manifest (github.com/flathub/org.jellyfin.JellyfinDesktop),
# moved to the Icefin app ID and built from this checkout. MpvQt is built from the external/mpvqt submodule
# (USE_STATIC_MPVQT). Patched mpv, Vulkan render API, libcec and SDL3 arrive in later phases (3, 5, 7).
# Build (lab only): flatpak-builder --user --install-deps-from=flathub --force-clean ~/fp-build flatpak/io.github.stealthx3.IcefinPlayer.yml
app-id: io.github.stealthx3.IcefinPlayer
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.qtwebengine.BaseApp
base-version: '6.11'
command: icefin-player
finish-args:
  - --socket=wayland
  - --socket=fallback-x11           # Gamescope XWayland only; native X11 desktops are unsupported (D5)
  - --share=ipc
  - --share=network                 # Jellyfin servers
  - --socket=pulseaudio             # PulseAudio / pipewire-pulse output, IEC958 format setting
  - --filesystem=xdg-run/pipewire-0 # mpv's native PipeWire output
  - --device=all                    # GPU, /dev/snd for exclusive ALSA, USB CEC, LIRC, gamepads
  - --filesystem=/run/lirc:ro       # LIRC remotes
  - --talk-name=org.freedesktop.ScreenSaver
  - --own-name=org.freedesktop.ReserveDevice1.*  # exclusive ALSA device reservation (3.5)
  - --own-name=org.mpris.MediaPlayer2.IcefinPlayer.*
  # Added with their features: --device=shm (host jackd, 3.1), Mutter DisplayConfig (refresh matching),
  # xdg-config/wireplumber:create (only if the runtime IEC958 setting fails, 3.4).
cleanup:
  - '*.a'
  - '*.la'
  - /bin/event_rpcgen.py
  - /include
  - /lib/cmake
  - /lib/metatypes
  - /lib/modules
  - /lib/pkgconfig
  - /lib/sbom
  - /mkspecs
  - /share/man
modules:
  - name: icefin-player
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DUSE_STATIC_MPVQT=ON
      - -DICEFIN_FLATPAK=ON
    run-tests: true
    build-options:
      test-args:
        - --env=QT_QPA_PLATFORM=offscreen
    sources:
      - type: dir
        path: ..
        skip:
          - .git
          - .flatpak-builder
          - build
          - flatpak/build-dir
          - docs
    modules:
      - name: libmpv
        buildsystem: meson
        config-opts:
          - -Dalsa=enabled   # Icefin: exclusive ALSA backend (Phase 3)
          - -Dbuild-date=false
          - -Ddebug=false
          - -Dlibmpv=true
          - -Dlua=enabled
          - -Dmanpage-build=disabled
        cleanup:
          - /share/applications
          - /share/bash-completion
          - /share/doc
          - /share/fish
          - /share/icons
          - /share/zsh
        sources:
          - type: archive
            url: https://github.com/mpv-player/mpv/archive/refs/tags/v0.42.0.tar.gz
            sha256: bcfebbfa2b65a6d88dc97ea18117831072373e38b5785a2afb874ed4df5070dd
            x-checker-data:
              type: anitya
              project-id: 5348
              stable-only: true
              url-template: https://github.com/mpv-player/mpv/archive/refs/tags/v$version.tar.gz

        modules:
          - name: luajit
            no-autogen: true
            make-args:
              - BUILDMODE=dynamic
              - PREFIX=${FLATPAK_DEST}
            make-install-args:
              - PREFIX=${FLATPAK_DEST}
            cleanup:
              - /bin
            sources:
              - type: git
                url: https://github.com/openresty/luajit2.git
                tag: v2.1-20261023
                commit: 5d8d0a27bfa4595b24b8ed36123555fcd2bb2f8c
                x-checker-data:
                  type: git
                  tag-pattern: ^v([\d.-]+)$

          - name: libplacebo
            buildsystem: meson
            config-opts:
              - -Ddemos=false
            cleanup:
              - /include
              - /lib/pkgconfig
            sources:
              - type: git
                url: https://github.com/haasn/libplacebo.git
                tag: v7.387.0
                commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65
                x-checker-data:
                  type: git
                  tag-pattern: ^v([\d.]+)$

          - name: libXpresent
            buildsystem: autotools
            sources:
              - type: archive
                url: https://xorg.freedesktop.org/archive/individual/lib/libXpresent-1.0.2.tar.xz
                sha256: 4e5b21b4812206a4b223013606ae31170502c1043038777a1ef8f70c09d37602
                x-checker-data:
                  type: anitya
                  project-id: 17166
                  stable-only: true
                  url-template: https://xorg.freedesktop.org/archive/individual/lib/libXpresent-$version.tar.xz

          - name: libass
            config-opts:
              - --disable-static
              - --enable-asm
              - --enable-harfbuzz
              - --enable-fontconfig
            sources:
              - type: archive
                url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.gz
                sha256: caab4b993dd7be6187c55623b789ed75dddefea6e65938af134637c732fe094a
                x-checker-data:
                  type: anitya
                  project-id: 1560
                  stable-only: true
                  url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.gz

          - name: uchardet
            buildsystem: cmake-ninja
            config-opts:
              - -DCMAKE_BUILD_TYPE=Release
              - -DBUILD_STATIC=0
              - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            cleanup:
              - /bin
            sources:
              - type: archive
                url: https://www.freedesktop.org/software/uchardet/releases/uchardet-0.0.8.tar.xz
                sha256: e97a60cfc00a1c147a674b097bb1422abd9fa78a2d9ce3f3fdcc2e78a34ac5f0
                x-checker-data:
                  type: anitya
                  project-id: 9265
                  stable-only: true
                  url-template: https://www.freedesktop.org/software/uchardet/releases/uchardet-$version.tar.xz
