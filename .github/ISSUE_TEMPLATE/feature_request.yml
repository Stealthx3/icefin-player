name: Feature request
description: Suggest an improvement to Icefin Player
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Check the [plan](../blob/main/docs/PLAN.md) and [decisions](../blob/main/docs/DECISIONS.md) first; your idea may already be scheduled or settled.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
