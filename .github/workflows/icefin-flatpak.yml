# Icefin: build the Flatpak, run unit tests inside the build sandbox, upload a bundle per commit (PLAN 1.5).
name: icefin-flatpak

on:
  push:
    branches: ["icefin/main"]   # the stack tip; layers share commits, so building each would duplicate work
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flatpak:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.11
      options: --privileged
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: flatpak/io.github.stealthx3.IcefinPlayer.yml
          bundle: icefin-player-${{ github.sha }}.flatpak
          run-tests: true
          cache-key: flatpak-builder-${{ hashFiles('flatpak/*.yml') }}
