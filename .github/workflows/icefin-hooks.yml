# Icefin: count ICEFIN-HOOK lines in upstream files and fail on unmarked edits (PLAN 1.4).
name: icefin-hooks

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the upstream mirror
        run: git fetch --quiet origin upstream/master:refs/remotes/origin/upstream/master
      - name: Count and check hooks
        run: scripts/icefin/hook-count.sh --summary "$GITHUB_STEP_SUMMARY"
      - name: Theme engine stays theme-agnostic
        run: scripts/icefin/theme-lint.sh
      - name: Theme colour contrast (every theme, preset and scheme)
        run: python3 scripts/icefin/theme-contrast.py
      - name: Theme sounds match their recipes
        run: python3 scripts/icefin/theme-sounds.py --check
      - name: Theme packages match the shared schemas
        run: |
          python3 -m venv /tmp/schema-venv
          /tmp/schema-venv/bin/pip install --quiet 'jsonschema>=4.18'
          /tmp/schema-venv/bin/python scripts/icefin/theme-schemas.py
